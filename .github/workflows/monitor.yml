name: Peony Monitor — maintenance only

# Railway is the single permanent runtime for the bot.
# GitHub Actions must NOT start runner.py, otherwise Telegram getUpdates
# gets a 409 Conflict because two bot instances run simultaneously.

on:
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Maintenance check
        run: |
          echo "Peony Monitor is running on Railway."
          echo "This GitHub Actions workflow intentionally does not start runner.py."
          echo "Do not use Run workflow to launch the bot."
